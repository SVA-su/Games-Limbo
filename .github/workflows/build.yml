name: Build and publish

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Extract Project Version
      id: extract_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Find and Upload JARs
      run: |
        echo "Looking for JAR files..."
        
        # Create the artifacts directory
        mkdir -p artifacts
        
        # Find all JAR files except sources and javadoc
        JAR_FILES=$(find target -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar")
        
        # Check if any JAR files are found
        if [ -z "$JAR_FILES" ]; then
          echo "No JAR files found"
          exit 1
        fi
        
        # Counter for unique file names
        COUNTER=1
        
        # Loop through all JAR files
        for JAR_FILE in $JAR_FILES; do
          BASENAME=$(basename "$JAR_FILE")
          RENAMED_FILE="artifacts/${BASENAME%.jar}-${COUNTER}.jar"
          echo "Copying $JAR_FILE to $RENAMED_FILE"
          cp "$JAR_FILE" "$RENAMED_FILE"
          COUNTER=$((COUNTER + 1))
        done
        
        echo "All files copied to artifacts folder."

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Limbo-${{ env.VERSION }}-${{ github.run_number }}
        path: artifacts/*.jar
